<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="titulo desc">
  <title id="titulo">João Epaminondas</title>
  <desc id="desc">CTO da Rota7 Solutions. Um caminhao percorre uma rota que liga os sistemas Base, Etapas, Automação Smart, Leitor Doc Gov e WhatsApp.</desc>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <pattern id="grade" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1b2740"/>
    </pattern>
    <linearGradient id="esmaece" x1="560" y1="0" x2="820" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="mascara-grade"><rect x="560" width="640" height="300" fill="url(#esmaece)"/></mask>
    <clipPath id="cartao"><rect width="1200" height="300" rx="18"/></clipPath>
    <path id="rota" d="M640 214 C700 214,700 124,760 124 C820 124,820 214,880 214 C940 214,940 124,1000 124 C1060 124,1060 214,1120 214"/>
  </defs>
  <style>
    .nome { font: 700 50px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #f0f4fa; letter-spacing: -0.5px; }
    .cargo { font: 500 21px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #aeb9c9; }
    .prompt { font: 500 15px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #22d3ee; }
    .cursor { fill: #22d3ee; animation: pisca 1.1s steps(1) infinite; }
    .no { font: 600 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #aeb9c9; }
    .chip { font: 600 15px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #aeb9c9; }
    .faixa { fill: none; stroke: #3b4d6b; stroke-width: 2; stroke-dasharray: 10 12; animation: anda 1.2s linear infinite; }
    .pulso { fill: none; stroke: #22d3ee; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: pulso 3s ease-out infinite; }
    @keyframes anda { to { stroke-dashoffset: -22; } }
    @keyframes pisca { 50% { opacity: 0; } }
    @keyframes pulso { 0% { opacity: .7; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.6); } }
    @media (prefers-reduced-motion: reduce) { .faixa, .pulso, .cursor { animation: none; } }
  </style>

  <g clip-path="url(#cartao)">
    <rect width="1200" height="300" fill="url(#fundo)"/>
    <rect x="560" width="640" height="300" fill="url(#grade)" mask="url(#mascara-grade)"/>

    <!-- estrada -->
    <use href="#rota" fill="none" stroke="#1d2b44" stroke-width="16" stroke-linecap="round"/>
    <use href="#rota" class="faixa"/>
    
    <circle cx="640" cy="214" r="9" class="pulso" style="animation-delay:0.0s"/>
    <circle cx="640" cy="214" r="8" fill="#0b1220" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="640" cy="214" r="3" fill="#22d3ee"/>
    <text x="640" y="248" class="no" text-anchor="middle">Base</text>
    <circle cx="760" cy="124" r="9" class="pulso" style="animation-delay:0.6s"/>
    <circle cx="760" cy="124" r="8" fill="#0b1220" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="760" cy="124" r="3" fill="#22d3ee"/>
    <text x="760" y="102" class="no" text-anchor="middle">Etapas</text>
    <circle cx="880" cy="214" r="9" class="pulso" style="animation-delay:1.2s"/>
    <circle cx="880" cy="214" r="8" fill="#0b1220" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="880" cy="214" r="3" fill="#22d3ee"/>
    <text x="880" y="248" class="no" text-anchor="middle">Automação Smart</text>
    <circle cx="1000" cy="124" r="9" class="pulso" style="animation-delay:1.8s"/>
    <circle cx="1000" cy="124" r="8" fill="#0b1220" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="1000" cy="124" r="3" fill="#22d3ee"/>
    <text x="1000" y="102" class="no" text-anchor="middle">Leitor Doc Gov</text>
    <circle cx="1120" cy="214" r="9" class="pulso" style="animation-delay:2.4s"/>
    <circle cx="1120" cy="214" r="8" fill="#0b1220" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="1120" cy="214" r="3" fill="#22d3ee"/>
    <text x="1120" y="248" class="no" text-anchor="middle">WhatsApp</text>

    <!-- caminhao -->
    <g>
      <g transform="translate(0,-1)">
        <rect x="-26" y="-8" width="28" height="16" rx="2.5" fill="#fbbf24"/>
        <rect x="4" y="-7" width="13" height="14" rx="3.5" fill="#fde68a"/>
        <rect x="11" y="-5" width="4" height="10" rx="1" fill="#0b1220"/>
      </g>
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;0.85;1" calcMode="linear">
        <mpath href="#rota"/>
      </animateMotion>
    </g>

    <!-- texto -->
    <text x="56" y="78" class="prompt">~/rota7 $ whoami<tspan class="cursor"> ▍</tspan></text>
    <text x="56" y="140" class="nome">João Epaminondas</text>
    <text x="56" y="178" class="cargo">CTO · Rota7 Solutions</text>
    <text x="56" y="208" class="cargo" style="font-size:17px;fill:#7d8aa0">Sistemas que movem a logística, do banco de dados ao caminhão.</text>
    <rect x="56" y="234" width="187" height="32" rx="16" fill="rgba(34,211,238,0.10)" stroke="rgba(34,211,238,0.35)"/><text x="150" y="255.5" class="chip" text-anchor="middle">23 apps em produção</text><rect x="253.1" y="234" width="169" height="32" rx="16" fill="rgba(34,211,238,0.10)" stroke="rgba(34,211,238,0.35)"/><text x="338" y="255.5" class="chip" text-anchor="middle">1 biblioteca base</text><rect x="432.4" y="234" width="169" height="32" rx="16" fill="rgba(34,211,238,0.10)" stroke="rgba(34,211,238,0.35)"/><text x="517" y="255.5" class="chip" text-anchor="middle">PHP · JS · Python</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="17.5" fill="none" stroke="rgba(255,255,255,0.08)"/>
</svg>
